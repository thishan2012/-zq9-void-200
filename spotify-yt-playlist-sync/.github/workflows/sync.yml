name: YouTube to Spotify sync

# One-way sync: a public/unlisted YouTube playlist is the source of truth and
# tracks are only ever ADDED to the Spotify playlist. Nothing is deleted.
#
# This file MUST stay at the repository root (.github/workflows/). GitHub only
# reads workflow files from there, so the copy inside the project folder
# (spotify-yt-playlist-sync/.github/workflows/sync.yml) never shows up in the
# Actions tab. Keep the two in sync if you edit them.
#
# Configuration (no secret values are ever written into this file):
#   secrets.YOUTUBE_API_KEY        YouTube Data API v3 key (read-only usage)
#   secrets.SPOTIFY_COOKIE         Netscape cookie export containing sp_dc
#   secrets.TELEGRAM_BOT_TOKEN     Telegram bot token (optional, full log)
#   secrets.TELEGRAM_CHAT_ID       Telegram chat id (optional, full log)
#   YOUTUBE_PLAYLIST / SPOTIFY_PLAYLIST  secrets, else variables
#   vars.REQUEST_DELAY_SECONDS     optional, default 2 s
#   vars.SEARCH_PAUSE_SECONDS      optional, default 0.5 s (extra gap between two searches)
#   vars.SPOTIFY_BATCH_SIZE        optional, default 100 (1-100)
#   vars.SPOTIFY_MAX_ADDS_PER_RUN  optional, default 15 (0 = no cap): songs added
#                                  per run; the rest wait for the next run, so a
#                                  backlog is spread out instead of one bulk add
#   vars.SYNC_ENABLED              set to 'true' to let scheduled runs write
#   vars.COMMIT_NAME / COMMIT_EMAIL  optional: who the database commit is
#                                   made by. Default thishcrvwqe-bot with an
#                                   address that belongs to no account, so GitHub
#                                   prints that name. If the repository rejects
#                                   the push, the step retries as the built-in
#                                   bot (history then says github-actions[bot]).
#   manual run only: the reset_db input (none / history / playlist / all)
#   drops part of the sync database before syncing - the emergency switch,
#   never touches the Spotify playlist, keeps a .bak copy of the file
#   (the Sunday run also retries skips older than 7 days - no setting needed)

on:
  schedule:
    # 4 runs a day, every 6 hours (UTC). Public repos have unlimited Actions
    # minutes, so the runs cost nothing; a run with no new songs is quick
    # because already-recorded videos are skipped without any Spotify search.
    #   00:17, 06:17, 12:17, 18:17 UTC = 05:47, 11:47, 17:47, 23:47 (SL)
    # GitHub cron is UTC only and may be delayed.
    # Scheduled runs are DRY RUNS unless the repository variable SYNC_ENABLED
    # is set to 'true'.
    # GitHub switches schedules off after 60 days without repository activity -
    # and "nothing new to sync" is this repository's normal state, so the
    # database step leaves one empty commit on the 1st of each month to keep
    # the clock reset. See "Save sync database" below.
    # Minute 17, not 0: the top of the hour is GitHub's busiest cron slot and
    # scheduled runs there start late or get dropped under load.
    - cron: '17 */6 * * *'
    # Weekly retry (Sunday 03:00 UTC = 08:30 SL). Only this run re-asks about
    # songs that were skipped more than RETRY_AFTER_DAYS (7) days ago, so a track
    # that came back to Spotify or a video that turned public is found again
    # automatically. One run a week: it costs almost no rate limit.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - preview only (no Spotify writes, no database changes)'
        type: boolean
        default: true
        required: false
      reset_db:
        description: 'Emergency: reset the sync database before syncing (leaves Spotify untouched)'
        type: choice
        default: 'none'
        options:
          - none
          - history
          - playlist
          - all
permissions:
  contents: write
concurrency:
  group: playlist-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: spotify-yt-playlist-sync
    env:
      # One switch for "really write", evaluated once:
      #   manual run      -> honour the dry_run checkbox (checked = preview)
      #   scheduled run   -> dry run unless SYNC_ENABLED == 'true'
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.event_name == 'schedule' && vars.SYNC_ENABLED != 'true') }}
      # The Sunday 03:00 run is the weekly one: it also retries skipped songs.
      RETRY_SKIPPED: ${{ github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The cookie is an account credential, so it never lives in the repository.
      # It is written to a git-ignored file just for this job.
      - name: Restore Spotify cookie
        env:
          SPOTIFY_COOKIE: ${{ secrets.SPOTIFY_COOKIE }}
        run: |
          if [ -z "$SPOTIFY_COOKIE" ]; then
            echo '::error::Repository secret SPOTIFY_COOKIE is not set (see instructions/03-spotify.md)'
            exit 1
          fi
          umask 077
          printf '%s\n' "$SPOTIFY_COOKIE" > cookies/spotify.txt

      # Emergency switch. It runs before the sync (so the same run rebuilds the
      # database) and never touches the Spotify playlist - it only forgets what
      # the sync already did. A .bak copy of the file is committed with it.
      - name: Reset the sync database (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_db != 'none' }}
        env:
          RESET_DB: ${{ inputs.reset_db }}
          SPOTIFY_PLAYLIST_INPUT: ${{ secrets.SPOTIFY_PLAYLIST || vars.SPOTIFY_PLAYLIST }}
        run: |
          SPOTIFY_URL="$SPOTIFY_PLAYLIST_INPUT"
          SPOTIFY_ID="${SPOTIFY_URL##*/playlist/}"
          SPOTIFY_ID="${SPOTIFY_ID%%\?*}"
          echo "::warning::Resetting the sync database (scope: $RESET_DB). The Spotify playlist is not touched."
          # A preview stays a preview: with the dry-run box ticked this only
          # reports what the reset would drop.
          YES=''
          if [ "$DRY_RUN" != 'true' ]; then YES='--yes'; fi
          if [ "$YES" = '' ]; then
            echo '::notice::Dry run: the database reset is only previewed, nothing is written.'
          fi
          if [ "$RESET_DB" = 'playlist' ]; then
            python -m syncer.app --reset-db playlist --playlist "$SPOTIFY_ID" $YES
          else
            python -m syncer.app --reset-db "$RESET_DB" $YES
          fi

      - name: Sync playlists (dry run unless DRY_RUN=false)
        id: sync
        env:
          # Secrets win over variables, so the links may live in either tab.
          YOUTUBE_PLAYLIST: ${{ secrets.YOUTUBE_PLAYLIST || vars.YOUTUBE_PLAYLIST || 'https://www.youtube.com/playlist?list=REPLACE_WITH_YOUR_YOUTUBE_PLAYLIST_ID' }}
          SPOTIFY_PLAYLIST: ${{ secrets.SPOTIFY_PLAYLIST || vars.SPOTIFY_PLAYLIST || 'https://open.spotify.com/playlist/REPLACE_WITH_YOUR_SPOTIFY_PLAYLIST_ID' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional tuning; also accepted from the Secrets tab by mistake.
          REQUEST_DELAY_SECONDS: ${{ vars.REQUEST_DELAY_SECONDS || secrets.REQUEST_DELAY_SECONDS || '2' }}
          SEARCH_PAUSE_SECONDS: ${{ vars.SEARCH_PAUSE_SECONDS || secrets.SEARCH_PAUSE_SECONDS || '0.5' }}
          SPOTIFY_BATCH_SIZE: ${{ vars.SPOTIFY_BATCH_SIZE || secrets.SPOTIFY_BATCH_SIZE || '100' }}
          SPOTIFY_MAX_ADDS_PER_RUN: ${{ vars.SPOTIFY_MAX_ADDS_PER_RUN || secrets.SPOTIFY_MAX_ADDS_PER_RUN || '15' }}
          RETRY_SKIPPED: ${{ env.RETRY_SKIPPED }}
        run: |
          echo "::notice::Dry run = $DRY_RUN"
          echo "::notice::Weekly skip retry = $RETRY_SKIPPED"
          if [ "$DRY_RUN" = "true" ]; then
            python -m syncer.app --dry-run
          else
            python -m syncer.app
          fi

      # The database that stops duplicates. Its summary is printed on the run
      # page so the saved songs are visible without cloning the repository.
      - name: Show the sync database
        if: ${{ always() && steps.sync.outcome != 'skipped' }}
        run: |
          python -m syncer.app --db-summary >> "$GITHUB_STEP_SUMMARY"
          python -m syncer.app --stats >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: ${{ always() && steps.sync.outcome != 'skipped' }}
        env:
          RETRY_SKIPPED: ${{ github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0' }}
          REQUEST_DELAY_SECONDS: ${{ vars.REQUEST_DELAY_SECONDS || secrets.REQUEST_DELAY_SECONDS || '2' }}
          SEARCH_PAUSE_SECONDS: ${{ vars.SEARCH_PAUSE_SECONDS || secrets.SEARCH_PAUSE_SECONDS || '0.5' }}
          SPOTIFY_BATCH_SIZE: ${{ vars.SPOTIFY_BATCH_SIZE || secrets.SPOTIFY_BATCH_SIZE || '100' }}
          SPOTIFY_MAX_ADDS_PER_RUN: ${{ vars.SPOTIFY_MAX_ADDS_PER_RUN || secrets.SPOTIFY_MAX_ADDS_PER_RUN || '15' }}
          SYNC_ENABLED: ${{ vars.SYNC_ENABLED }}
          RESET_DB: ${{ inputs.reset_db }}
          # Only the playlist name is read here (one read-only API call).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_PLAYLIST: ${{ secrets.YOUTUBE_PLAYLIST || vars.YOUTUBE_PLAYLIST || 'https://www.youtube.com/playlist?list=REPLACE_WITH_YOUR_YOUTUBE_PLAYLIST_ID' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            MODE='DRY RUN — Spotify untouched (only skip/failure bookkeeping is saved)'
          else
            MODE='LIVE SYNC — tracks added, database committed'
          fi
          NAME=$(python -m syncer.app --playlist-title 2>/dev/null || true)
          {
            echo "### YouTube → Spotify: $MODE"
            if [ -n "$NAME" ]; then
              echo
              echo "**Playlist:** $NAME"
            fi
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Scheduled writes enabled | \`${SYNC_ENABLED:-false}\` |"
            echo "| Weekly skip retry | \`${RETRY_SKIPPED:-false}\` |"
            if [ -n "${RESET_DB:-}" ] && [ "$RESET_DB" != 'none' ]; then
              echo "| Database reset | \`$RESET_DB\` (Spotify untouched) |"
            fi
            echo "| Request delay | \`$REQUEST_DELAY_SECONDS\` s |"
            echo "| Search pause | \`$SEARCH_PAUSE_SECONDS\` s |"
            echo "| Batch size | \`$SPOTIFY_BATCH_SIZE\` |"
            if [ "${SPOTIFY_MAX_ADDS_PER_RUN:-15}" = '0' ]; then
              echo "| Max additions per run | \`unlimited\` |"
            else
              echo "| Max additions per run | \`$SPOTIFY_MAX_ADDS_PER_RUN\` (rest next run) |"
            fi
            echo
            echo 'Per-song detail (ADD / WOULD ADD / SKIP / FAIL) is in the "Sync playlists" log above and in the Telegram full log.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove cookie file
        if: ${{ always() }}
        run: rm -f cookies/spotify.txt

      # Saved in dry runs too: the bookkeeping of songs that were reported with
      # a real reason (so they are not logged again). Podcast/YouTube reads are
      # free; only Spotify writes are skipped in a dry run.
      - name: Save sync database
        if: ${{ always() && steps.sync.outcome != 'skipped' }}
        env:
          # GitHub prints a commit's author *account* in the history, and an
          # account is looked up by the author e-mail. The built-in bot's
          # address therefore always shows "github-actions[bot]" no matter what
          # the name says. An address that belongs to no account makes GitHub
          # print the git name instead - which is what we want here.
          # Both are overridable from the repository variables.
          COMMIT_NAME: ${{ vars.COMMIT_NAME || 'thishcrvwqe-bot' }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL || 'thishcrvwqe-bot@users.noreply.github.com' }}
          BOT_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          echo "::group::Database commit diagnostics"
          git status --short -- data/ || true
          git log --oneline -1
          echo "HEAD: $(git rev-parse --abbrev-ref HEAD) $(git rev-parse --short HEAD)"
          # Never print the token that checkout put in the remote URL.
          git remote -v | sed 's#https://[^@/]*@#https://***@#'
          echo "::endgroup::"
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add data/sync-state.json
          if [ -f data/sync-state.json.bak ]; then
            git add -f data/sync-state.json.bak
          fi
          # A run with nothing new writes no commit - except on the first run of
          # a month, which carries a one-line heartbeat. Without it a public
          # repository that is quiet for 60 days has its schedules switched off
          # by GitHub, silently: nothing new to sync is exactly the normal state
          # of this repository, so the clock would run out on its own.
          # At most one per month: the four runs of the first day would otherwise
          # all leave a commit.
          HEARTBEAT_MSG='Keep the schedule alive (monthly heartbeat)'
          HEARTBEAT=
          if [ "$DRY_RUN" != "true" ] && [ "$DRY_RUN" != "false" ] \
            && [ "$(date -u +%d)" = '01' ] \
            && [ "$(git log -1 --format=%s)" != "$HEARTBEAT_MSG" ]; then
            HEARTBEAT=1
          fi
          if git diff --quiet -- data/sync-state.json && [ -z "$HEARTBEAT" ]; then
            echo '::notice::No database changes in this run, so there is nothing to commit.'
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            MESSAGE='Update skip/failure bookkeeping (dry run)'
          elif [ -n "$HEARTBEAT" ]; then
            MESSAGE='Keep the schedule alive (monthly heartbeat)'
          else
            MESSAGE='Update playlist sync state'
          fi
          # The heartbeat is deliberately an empty commit: it exists to count as
          # repository activity, nothing else.
          if [ -n "$HEARTBEAT" ]; then
            git commit --allow-empty -m "$MESSAGE"
          else
            git commit -m "$MESSAGE"
          fi
          # A changed database must not fail the whole run: the songs were
          # already added to Spotify (or reported as a dry run) at this point.
          # The run takes minutes; main may have moved on meanwhile, so rebase
          # the one-file commit on top instead of failing the push.
          rebase() {
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
              || git rebase --abort >/dev/null 2>&1 || true
          }
          rebase
          if git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1; then
            echo "::notice::Database commit by $COMMIT_NAME <$COMMIT_EMAIL>"
            echo 'Database saved.'
            exit 0
          fi
          # Some repository policies only accept the built-in bot as the author.
          # Losing the bookkeeping would be worse than a bot-looking name, so
          # retry once as the bot.
          echo "::warning::Push as $COMMIT_EMAIL was rejected; retrying as the built-in bot (the history will then say github-actions[bot])."
          git config user.name 'github-actions[bot]'
          git config user.email "$BOT_EMAIL"
          git commit --amend --reset-author --no-edit
          rebase
          if git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1; then
            echo 'Database saved (as github-actions[bot]).'
          else
            echo "::group::Why the push failed"
            git log --oneline -3 || true
            git status --short || true
            echo "::endgroup::"
            echo "::error::Could not push data/sync-state.json to ${GITHUB_REF_NAME}. The songs were added, but the database (and the commit name) is now one run behind. Settings -> Actions -> General -> Workflow permissions must be 'Read and write permissions'."
          fi
