name: YouTube to Spotify sync
on:
  schedule:
    # 00:00 and 12:00 UTC. Actions schedules may be delayed.
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (do not add tracks or save database changes)'
        type: boolean
        default: true
        required: true
permissions:
  contents: write
concurrency:
  group: playlist-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync playlists
        id: sync
        env:
          YOUTUBE_PLAYLIST: 'https://youtube.com/playlist?list=PLZN2mokux__I'
          SPOTIFY_PLAYLIST: 'https://open.spotify.com/playlist/26ADR9K06DZ826IsgTno1S'
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUEST_DELAY_SECONDS: ${{ vars.REQUEST_DELAY_SECONDS || '2' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m syncer.app --dry-run
          else
            python -m syncer.app
          fi
      - name: Save sync database
        if: ${{ always() && steps.sync.outcome != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if git diff --quiet -- data/sync-state.json; then
            echo 'No database changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sync-state.json
          git commit -m 'Update playlist sync state'
          git push origin "HEAD:${GITHUB_REF_NAME}"
